<!DOCTYPE html>
<html lang="en" data-theme="solarized-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.20/dist/full.min.css" rel="stylesheet" type="text/css" />
  <style>
    .heatmap-container {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .heatmap-axis-y {
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: flex-start;
      padding-top: 20px;
    }

    .weekday-label {
      width: 24px;
      height: 14px;
      font-size: 10px;
      text-align: center;
      line-height: 14px;
    }

    .heatmap-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .heatmap-axis-x {
      display: flex;
      gap: 2px;
      margin-left: 24px;
    }

    .month-label {
      flex: 0 0 90px;
      font-size: 11px;
      text-align: center;
      height: 16px;
      line-height: 16px;
    }

    .heatmap-grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: fit-content;
    }

    .heatmap-row {
      display: flex;
      gap: 2px;
    }

    .heatmap-cell {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .heatmap-cell:hover {
      transform: scale(1.2);
      filter: brightness(1.2);
      z-index: 10;
    }

    .heatmap-cell.level-0 {
      background-color: #d1d5db;
    }

    .heatmap-cell.level-1 {
      background-color: #fb923c;
      opacity: 0.4;
    }

    .heatmap-cell.level-2 {
      background-color: #f97316;
      opacity: 0.6;
    }

    .heatmap-cell.level-3 {
      background-color: #ea580c;
      opacity: 0.8;
    }

    .heatmap-cell.level-4 {
      background-color: #c2410c;
    }

    .heatmap-tooltip {
      position: fixed;
      background-color: #1f2937;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    html[data-theme="solarized-light"] .heatmap-tooltip {
      background-color: #fdf6e3;
      color: #073642;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <div class="max-w-2xl mx-auto p-4 md:p-6">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl font-bold">Bean Counter</h1>
          <p class="text-base-content/60">Your consistency streak</p>
        </div>
        <button
          class="btn btn-circle btn-sm md:btn-md"
          onclick="toggleTheme()"
          title="Toggle theme">
          <span id="theme-icon">🌙</span>
        </button>
      </div>

      <div id="activities-container" class="space-y-6"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
