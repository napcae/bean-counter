<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --color-github-0: #0d1117;
      --color-github-1: #161b22;
      --color-github-2: #21262d;
      --color-github-3: #30363d;
      --color-github-4: #484f58;
      --color-github-5: #6e7681;
      --color-github-6: #8b949e;
      --color-github-7: #c9d1d9;
      --color-github-8: #f0f6fc;
    }

    /* Dark theme: Solarized-inspired with saturated geometric */
    :root.dark {
      --bg-primary: #0b1017;
      --bg-secondary: #1a1f2e;
      --text-primary: #e8e9ed;
      --text-secondary: #a5aab8;
      --accent-warm: #ff6b35;
      --accent-cool: #00d9ff;
      --accent-success: #00ff88;
      --accent-warn: #ffd700;
      --grid-none: #2a2f3e;
      --grid-low: #3a4255;
      --grid-mid: #ff6b35;
      --grid-high: #00d9ff;
    }

    /* Light theme: Bright Solarized with saturated geometric */
    :root.light {
      --bg-primary: #fdf6e3;
      --bg-secondary: #eee8d5;
      --text-primary: #002b36;
      --text-secondary: #586e75;
      --accent-warm: #cb4b16;
      --accent-cool: #269bd1;
      --accent-success: #859900;
      --accent-warn: #b58900;
      --grid-none: #e8e1d0;
      --grid-low: #d4cec0;
      --grid-mid: #cb4b16;
      --grid-high: #269bd1;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12px, 1fr));
      gap: 2px;
      width: 100%;
      max-width: 500px;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .heatmap-cell:hover {
      transform: scale(1.2);
      filter: brightness(1.2);
      border-color: var(--text-secondary);
    }

    .heatmap-cell.level-0 {
      background-color: var(--grid-none);
    }

    .heatmap-cell.level-1 {
      background-color: var(--grid-low);
    }

    .heatmap-cell.level-2 {
      background-color: var(--grid-mid);
      opacity: 0.6;
    }

    .heatmap-cell.level-3 {
      background-color: var(--grid-mid);
      opacity: 0.85;
    }

    .heatmap-cell.level-4 {
      background-color: var(--grid-high);
    }

    .activity-card {
      background-color: var(--bg-secondary);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .activity-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .activity-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .stat-value {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 16px;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      background-color: var(--accent-cool);
      color: var(--bg-primary);
    }

    .streak {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-cool));
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .activity-card {
        padding: 16px;
        margin-bottom: 20px;
      }

      .activity-title {
        font-size: 16px;
      }

      .heatmap-grid {
        max-width: 100%;
      }
    }
  </style>
</head>
<body class="dark">
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
    <span id="theme-icon">🌙</span>
  </button>

  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <header style="margin-bottom: 32px; text-align: center;">
      <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Bean Counter</h1>
      <p style="color: var(--text-secondary); font-size: 14px;">Your consistency streak</p>
    </header>

    <div id="activities-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
